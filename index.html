<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#010714" />

    <title>Pawan Edits // Sony FX3 Cinema NLE Portfolio</title>
    <meta 
      name="description" 
      content="High-retention short-form video editor specializing in Reels, YouTube Shorts, and cinematic post-production for digital creators and brands." 
    />

    <!-- Priority 1: LCP Hero Image Preload with explicit MIME & fetchpriority -->
    <link 
      rel="preload" 
      as="image" 
      href="/pawan.webp" 
      type="image/webp" 
      fetchpriority="high" 
    />

    <!-- Preconnect to Font Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-Blocking Google Fonts Loading Pattern -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
